<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" fill="none">
  <!-- Cień -->
  <ellipse cx="160" cy="150" rx="130" ry="7" fill="rgba(0,0,0,0.08)"/>

  <!-- Naczepa / skrzynia ładunkowa -->
  <rect x="20" y="60" width="195" height="70" rx="6" fill="#64748b"/>
  <rect x="20" y="60" width="195" height="8" rx="3" fill="#475569"/>

  <!-- Linie na skrzyni -->
  <line x1="20" y1="85" x2="215" y2="85" stroke="#94a3b8" stroke-width="1" opacity="0.3"/>
  <line x1="20" y1="105" x2="215" y2="105" stroke="#94a3b8" stroke-width="1" opacity="0.3"/>
  <line x1="100" y1="60" x2="100" y2="130" stroke="#94a3b8" stroke-width="1" opacity="0.3"/>
  <line x1="160" y1="60" x2="160" y2="130" stroke="#94a3b8" stroke-width="1" opacity="0.3"/>

  <!-- Kabina kierowcy -->
  <rect x="215" y="70" width="85" height="60" rx="8" fill="#475569"/>
  <rect x="223" y="72" width="60" height="32" rx="4" fill="#bfdbfe" opacity="0.6"/>

  <!-- Reflektor przedni -->
  <rect x="292" y="85" width="10" height="16" rx="3" fill="#fbbf24" opacity="0.9"/>
  <rect x="292" y="104" width="10" height="10" rx="2" fill="#fbbf24" opacity="0.5"/>

  <!-- Zderzak -->
  <rect x="215" y="118" width="85" height="12" rx="3" fill="#334155"/>

  <!-- Koła kabiny -->
  <circle cx="255" cy="140" r="20" fill="#1e293b"/>
  <circle cx="255" cy="140" r="11" fill="#475569"/>
  <circle cx="255" cy="140" r="4" fill="#94a3b8"/>

  <circle cx="295" cy="140" r="20" fill="#1e293b"/>
  <circle cx="295" cy="140" r="11" fill="#475569"/>
  <circle cx="295" cy="140" r="4" fill="#94a3b8"/>

  <!-- Koła skrzyni -->
  <circle cx="55" cy="140" r="18" fill="#1e293b"/>
  <circle cx="55" cy="140" r="10" fill="#475569"/>
  <circle cx="55" cy="140" r="4" fill="#94a3b8"/>

  <circle cx="115" cy="140" r="18" fill="#1e293b"/>
  <circle cx="115" cy="140" r="10" fill="#475569"/>
  <circle cx="115" cy="140" r="4" fill="#94a3b8"/>

  <!-- Tylne światła -->
  <rect x="20" y="85" width="8" height="18" rx="2" fill="#ef4444" opacity="0.8"/>
</svg>
